<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>diseño gráfico | catalina oyanedel</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #d6e6ff; /* Azul celeste */
      --text-color: #2b2b2a; 
      --line-color: #2b2b2a; 
    }
    
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body {
      font-family: 'Instrument Sans', sans-serif;
      text-transform: lowercase; 
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- ENCABEZADO SUPERIOR BORDE A BORDE --- */
    .top-header {
      width: 100%;
      padding: 1.8rem 3rem; 
      border-bottom: 1.5px solid var(--line-color);
      margin-bottom: 4rem;
    }

    .top-header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* --- GRILLA DE PROYECTOS --- */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 280px));
      gap: 3rem;
      padding: 0 3rem 4rem 3rem;
    }

    .project-card {
      text-decoration: none;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      transition: opacity 0.3s ease;
    }

    .project-card:hover {
      opacity: 0.8;
    }

    .image-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1; /* Cuadrado perfecto */
      background-color: #ffffff; /* Cuadro blanco limpio */
      border: 1px solid var(--line-color);
      margin-bottom: 1rem;
    }

    .project-card h2 {
      font-size: 1.35rem;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    @media (max-width: 768px) {
      .top-header { padding: 1.5rem; }
      .projects-grid { 
        padding: 0 1.5rem 3rem 1.5rem;
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header class="top-header">
    <h1>diseño gráfico</h1>
  </header>

  <main class="projects-grid">
    
    <!-- Proyecto 1 (Abre en nueva pestaña) -->
    <a href="proyecto-fauna.html" target="_blank" class="project-card">
      <div class="image-wrapper"></div>
      <h2>conoce a tu flora y fauna nativa</h2>
    </a>

    <!-- Proyecto 2 Placeholder -->
    <a href="#" class="project-card">
      <div class="image-wrapper"></div>
      <h2>proyecto de prueba</h2>
    </a>

    <!-- Proyecto 3 Placeholder -->
    <a href="#" class="project-card">
      <div class="image-wrapper"></div>
      <h2>proyecto de prueba</h2>
    </a>

  </main>

</body>
</html>
