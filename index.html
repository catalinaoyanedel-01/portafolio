<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>catalina oyanedel | portafolio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #ffffff; 
      --accent: #ffffff; 
    }
    
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      /* Renderizado suavizado y nítido de letras */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body {
      font-family: 'Instrument Sans', sans-serif;
      text-transform: lowercase; 
      color: var(--text);
      
      /* Fondo a pantalla completa */
      background-image: url('background.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed; 
      background-repeat: no-repeat;
      
      /* Centrado perfecto */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center; 
      align-items: center;
      position: relative; 
    }
    
    /* --- SECCIÓN CENTRAL --- */
    .hero-center {
      text-align: center;
      transform: translateY(-2rem); 
    }

    h1 { 
      font-size: 4rem; 
      font-weight: 400; /* Quita el grosor automático y la hace más fina */
      color: var(--accent); 
      margin-bottom: 0.3rem; 
      letter-spacing: -0.03em; /* Ajuste tipográfico estilo Figma */
    }

    .link-sobre-mi {
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 400;
      text-decoration: none;
      border-bottom: 1px solid var(--text); 
      padding-bottom: 2px;
      transition: opacity 0.3s ease;
    }

    .link-sobre-mi:hover {
      opacity: 0.7; 
    }
    
    /* --- MENÚ INFERIOR --- */
    .menu-inferior {
      position: absolute;
      bottom: 3rem; 
      width: 100%;
      padding: 0 2rem;
      display: flex;
      justify-content: space-evenly; 
      flex-wrap: wrap;
      gap: 1rem;
    }
    
    .menu-inferior a {
      color: var(--text);
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 400; 
      transition: opacity 0.3s ease;
    }
    
    .menu-inferior a:hover {
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      h1 { font-size: 2.5rem; }
      .menu-inferior {
        flex-direction: column;
        align-items: center;
        bottom: 2rem;
        gap: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Contenedor central -->
  <main class="hero-center">
    <h1>catalina oyanedel</h1>
    <a href="sobre-mi.html" class="link-sobre-mi" target="_blank">sobre mí</a>
  </main>

  <!-- Menú anclado abajo -->
  <nav class="menu-inferior">
    <a href="grafico.html" target="_blank">diseño gráfico</a>
    <a href="fotografia.html" target="_blank">fotografía</a>
    <a href="interaccion.html" target="_blank">interacción digital</a>
    <a href="ilustracion.html" target="_blank">ilustración / pintura</a>
  </nav>

</body>
</html>
