<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>catalina oyanedel — portafolio multidisciplinar</title>
<link rel="icon" type="image/png" href="imagenes/estrella.png">

<style>
  /* ============ TIPOGRAFÍAS ============
     Coloca los archivos .otf dentro de una carpeta /fonts junto a este
     index.html (te dejo los 3 que se usan listos para descargar).       */
  @font-face{
    font-family:'PP Writer';
    src:url('fonts/PPWriter-Regular.otf') format('opentype');
    font-weight:400;
    font-style:normal;
  }
  @font-face{
    font-family:'PP Writer Thin Text';
    src:url('fonts/PPWriter-ThinText.otf') format('opentype');
    font-weight:100;
    font-style:normal;
  }
  @font-face{
    font-family:'PP Lettra Mono';
    src:url('fonts/PPLettraMono-MediumItalic.otf') format('opentype');
    font-weight:500;
    font-style:italic;
  }

  :root{
    --azul:#271DDB;
    --blanco:#FFFFFF;
    --tinta:#161616;
    --linea: rgba(39,29,219,0.35);
    --linea-suave: rgba(39,29,219,0.16);
    --maxw: 720px;
  }

  *{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--blanco);
    color:var(--tinta);
    -webkit-font-smoothing:antialiased;
  }

  img{ max-width:100%; display:block; }

  a{ color:var(--azul); }

  /* ============ TÍTULOS Y NOMBRE ============ */
  .nombre{
    font-family:'PP Writer', serif;
    font-weight:400;
    color:var(--azul);
    letter-spacing:-0.02em;
    margin:0;
    line-height:1;
  }

  .tagline, .cuerpo-thin{
    font-family:'PP Writer Thin Text', sans-serif;
    font-weight:100;
    letter-spacing:0.01em;
    color:var(--tinta);
  }

  .mono-italica{
    font-family:'PP Lettra Mono', monospace;
    font-style:italic;
    font-weight:500;
    letter-spacing:0.01em;
  }

  /* ============ HERO ============ */
  .hero{
    padding:32px 24px 40px;
    text-align:center;
  }

  .hero__ornamento-wrap{
    width:100%;
    max-height:200px;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  .hero__ornamento{
    display:block;
    width:auto;
    height:auto;
    max-width:100%;
    max-height:100%;
    opacity:0.9;
  }

  .hero__marca{
    max-width:var(--maxw);
    margin:8px auto 0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
  }

  .hero__estrella{
    width:56px;
    height:56px;
    background:var(--azul);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    position:relative;
    top:-4px;
  }
  .hero__estrella img{ width:60%; }

  .hero__titulos{ text-align:left; }

  .nombre{ font-size:clamp(28px, 4.5vw, 40px); }

  .tagline{
    font-size:clamp(15px, 2vw, 17px);
    margin-top:2px;
  }

  .hero__intro{
    max-width:560px;
    margin:40px auto 0;
    font-family:'PP Writer Thin Text', sans-serif;
    font-weight:100;
    letter-spacing:0.01em;
    font-size:21px;
    line-height:1.6;
    text-wrap:pretty;
  }

  .hero__intro--cierre{
    margin:16px auto 0;
  }

  /* ============ SECCIONES ============ */
  section{
    max-width:1080px;
    margin:0 auto;
    padding:64px 24px;
  }

  .seccion__titulo{
    font-family:'PP Writer', serif;
    color:var(--azul);
    letter-spacing:0.02em;
    font-size:20px;
    margin:0 0 32px;
  }

  #proyectos{
    padding-top:24px;
  }

  /* ============ FILTROS ============ */
  .filtros{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:40px;
  }

  .filtro{
    font-family:'PP Lettra Mono', monospace;
    font-style:italic;
    font-weight:500;
    font-size:14px;
    letter-spacing:0.01em;
    color:var(--azul);
    background:none;
    border:1px solid var(--azul);
    border-radius:999px;
    padding:8px 18px;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .filtro:hover{ background:var(--linea-suave); }
  .filtro.activo{ background:var(--azul); color:var(--blanco); }

  /* ============ GRILLA DE PROYECTOS ============ */
  .grilla{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
  }

  @media (max-width:900px){
    .grilla{ grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width:520px){
    .grilla{ grid-template-columns:1fr; }
  }

  .proyecto{
    aspect-ratio:4/5;
    border:1px solid var(--azul);
    border-radius:18px;
    background:#EFEFEF;
    display:flex;
    align-items:flex-end;
    padding:16px;
    text-decoration:none;
    color:var(--tinta);
    overflow:hidden;
    position:relative;
    transition:transform 0.2s ease;
    /* reset de <button> */
    font:inherit;
    text-align:left;
    appearance:none;
    cursor:pointer;
    width:100%;
  }
  .proyecto:hover{ transform:translateY(-4px); }

  .proyecto__info{
    background:rgba(255,255,255,0.88);
    padding:8px 12px;
    border-radius:10px;
    width:100%;
  }

  .proyecto__nombre{
    font-family:'PP Writer', serif;
    font-size:15px;
    letter-spacing:-0.01em;
    margin:0 0 2px;
    color:var(--tinta);
  }

  .proyecto__categoria{
    font-family:'PP Lettra Mono', monospace;
    font-style:italic;
    font-size:12px;
    color:var(--azul);
    margin:0;
  }

  .proyecto[hidden]{ display:none; }

  /* ============ MODAL DE PROYECTO ============ */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,0.88);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    z-index:1000;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
  }
  .modal-overlay.activo{
    opacity:1;
    pointer-events:auto;
  }

  .modal{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    width:100%;
    max-width:900px;
    max-height:85vh;
  }

  .modal__titulo{
    flex:0 0 auto;
    background:var(--azul);
    color:var(--blanco);
    border-radius:999px;
    padding:10px 22px;
    margin:0 0 8px;
    font-size:15px;
  }

  .modal__caja{
    position:relative;
    width:100%;
    box-shadow:0 20px 60px rgba(39,29,219,0.15);
  }

  .modal__cerrar{
    position:absolute;
    top:14px;
    right:14px;
    z-index:3;
    width:36px;
    height:36px;
    border-radius:50%;
    border:1px solid var(--azul);
    background:var(--blanco);
    color:var(--azul);
    font-size:20px;
    line-height:1;
    cursor:pointer;
  }
  .modal__cerrar:hover{ background:var(--linea-suave); }

  .modal__contenido{
    background:var(--blanco);
    border:1px solid var(--azul);
    border-radius:18px;
    max-height:85vh;
    overflow:hidden;
    padding-top:14px;
  }

  /* -- tipo: imagen única -- */
  .modal--imagen .modal__cuerpo{
    padding:0 24px 24px;
    display:flex;
    justify-content:center;
  }
  .modal--imagen img{
    max-height:65vh;
    border-radius:10px;
  }

  /* -- tipo: galería (scroll horizontal, título fijo arriba) -- */
  .modal--galeria .modal__cuerpo{
    display:flex;
    gap:16px;
    overflow-x:auto;
    padding:24px;
    scroll-snap-type:x mandatory;
  }
  .modal--galeria .modal__cuerpo img{
    height:60vh;
    flex:0 0 auto;
    border-radius:10px;
    scroll-snap-align:start;
  }

  /* -- tipo: concepto (scroll vertical con texto e imágenes) -- */
  .modal--concepto .modal__cuerpo{
    padding:0 24px 32px;
    max-height:calc(85vh - 60px);
    overflow-y:auto;
  }
  .modal--concepto .modal__cuerpo img{
    width:100%;
    border-radius:10px;
    margin-bottom:20px;
  }
  .modal--concepto .modal__cuerpo p{
    font-size:16px;
    line-height:1.7;
    margin:0 0 20px;
  }

  @media (max-width:600px){
    .modal--galeria .modal__cuerpo img{ height:40vh; }
  }

  /* ============ CONTACTO ============ */
  .contacto{
    text-align:center;
    border-top:1px solid var(--linea-suave);
  }

  .contacto__lista{
    display:flex;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
    margin-top:16px;
    font-size:15px;
  }

  .contacto__lista a{ text-decoration:none; border-bottom:1px solid var(--linea); }
  .contacto__lista a:hover{ border-color:var(--azul); }

  footer{
    text-align:center;
    padding:32px 24px 48px;
    font-family:'PP Lettra Mono', monospace;
    font-style:italic;
    font-size:12px;
    color:var(--linea);
  }

  @media (max-width:560px){
    .hero__marca{ flex-direction:column; }
    .hero__titulos{ text-align:center; }
  }
</style>
</head>
<body>

<!-- ============ HERO ============ -->
<header>
  <div class="hero__ornamento-wrap">
    <img class="hero__ornamento" src="imagenes/ilus-vector4.png" alt="">
  </div>

  <div class="hero">
    <div class="hero__marca">
      <div class="hero__estrella">
        <img src="imagenes/estrella.png" alt="">
      </div>
      <div class="hero__titulos">
        <p class="nombre">catalina oyanedel</p>
        <p class="tagline">portafolio multidisciplinar.</p>
      </div>
    </div>

    <p class="hero__intro">
      en mis proyectos me inspiro principalmente desde la naturaleza,
      lo mágico, la cultura y lo social.
    </p>
    <p class="hero__intro hero__intro--cierre">conoce más en profundidad aquí !</p>
  </div>
</header>

<!-- ============ PROYECTOS ============ -->
<section id="proyectos">
  <h2 class="seccion__titulo">proyectos</h2>

  <div class="filtros">
    <button class="filtro activo" data-filtro="todo">todo</button>
    <button class="filtro" data-filtro="diseno-grafico">diseño gráfico</button>
    <button class="filtro" data-filtro="fotografia">fotografía</button>
    <button class="filtro" data-filtro="ilustracion">ilustración</button>
    <button class="filtro" data-filtro="interaccion-digital">interacción digital</button>
  </div>

  <div class="grilla" id="grilla-proyectos">
    <!-- Las tarjetas se generan solas desde proyectosData (al final del archivo, en la sección de scripts).
         Para agregar, quitar o reordenar proyectos, edita solo proyectosData. -->
  </div>
</section>

<!-- ============ MODAL DE PROYECTO ============ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <p class="modal__titulo mono-italica" id="modal-titulo"></p>
    <div class="modal__caja">
      <button type="button" class="modal__cerrar" id="modal-cerrar" aria-label="Cerrar">×</button>
      <div class="modal__contenido" id="modal-contenido"></div>
    </div>
  </div>
</div>


<!-- ============ CONTACTO ============ -->
<section id="contacto" class="contacto">
  <h2 class="seccion__titulo">contacto</h2>
  <div class="contacto__lista cuerpo-thin">
    <a href="mailto:catalinaoyanedel3@gmail.com">catalinaoyanedel3@gmail.com</a>
    <a href="https://www.instagram.com/catalinamiaaaa/" target="_blank" rel="noopener">instagram</a>
  </div>
</section>

<footer>catalina oyanedel — {AÑO}</footer>

<script>
  // ============ DATOS DE PROYECTOS ============
  // Cada proyecto se define UNA sola vez aquí. La grilla y el modal se arman desde estos datos.
  //   id (la clave)   : sin espacios ni tildes, único
  //   orden           : posición en la grilla (cámbialo para reordenar)
  //   categorias      : lista de áreas. Un trabajo puede tener una o varias, ej: ['ilustracion', 'diseno-grafico']
  //                     (deben coincidir con un data-filtro y con la lista nombresCategorias de abajo)
  //   nombre          : texto de la tarjeta
  //   anio            : opcional, por si luego ordenas por fecha
  //   portada         : nombre del archivo de la tarjeta (si va vacío, se ve el fondo gris)
  //   tipo            : 'imagen' (una sola) | 'galeria' (varias, scroll lateral) | 'concepto' (texto + imágenes, scroll vertical)
  //   titulo          : título del modal
  //   imagenes        : lista de nombres de archivo del modal
  //   texto           : lista de párrafos (solo para 'concepto')

  // Carpeta donde están las imágenes. En cada ficha escribe solo el nombre del archivo (ej: 'ilustracion-flor.webp');
  // si un nombre ya trae una ruta con '/', se respeta tal cual.
  const carpetaImagenes = 'imagenes/proyectos/';
  const ruta = src => (!src || src.includes('/')) ? src : carpetaImagenes + src;

  // Cómo se escribe cada área en la tarjeta (la etiqueta se arma sola desde 'categorias')
  const nombresCategorias = {
    'diseno-grafico': 'diseño gráfico',
    'fotografia': 'fotografía',
    'ilustracion': 'ilustración',
    'interaccion-digital': 'interacción digital'
  };

  const proyectosData = {
    // ---------- ILUSTRACIÓN ----------
    'una-carta-para-ti': {
      orden: 1,
      categorias: ['ilustracion'],
      nombre: 'una carta para ti',
      anio: 2025,
      portada: 'ilustracion-cartadeamor.webp',
      tipo: 'imagen',
      titulo: 'una carta para ti',
      imagenes: ['ilustracion-cartadeamor.webp']
    },
    'composicion-ornamental': {
      orden: 2,
      categorias: ['ilustracion'],
      nombre: 'composición ornamental',
      anio: 2025,
      portada: 'ilustracion-compisicion.webp',
      tipo: 'imagen',
      titulo: 'composición ornamental',
      imagenes: ['ilustracion-compisicion.webp']
    },
    'conoce-a-tu-fauna-nativa': {
      orden: 3,
      categorias: ['ilustracion', 'diseno-grafico'],
      nombre: 'fauna nativa: gato de geoffroy',
      anio: 2025,
      portada: 'ilustracion-conoceatufaunanativa.webp',
      tipo: 'imagen',
      titulo: 'conoce a tu fauna nativa: gato de geoffroy',
      imagenes: ['ilustracion-conoceatufaunanativa.webp']
    },
    'espirales': {
      orden: 4,
      categorias: ['ilustracion'],
      nombre: 'soñar espiral',
      anio: 2025,
      portada: 'ilustracion-espirales.webp',
      tipo: 'imagen',
      titulo: 'soñar espiral',
      imagenes: ['ilustracion-espirales.webp']
    },
    'portal-floral': {
      orden: 5,
      categorias: ['ilustracion'],
      nombre: 'portal floral',
      anio: 2025,
      portada: 'ilustracion-flor.webp',
      tipo: 'imagen',
      titulo: 'portal floral',
      imagenes: ['ilustracion-flor.webp']
    },
    'hazme-brillar': {
      orden: 6,
      categorias: ['ilustracion'],
      nombre: 'hazme brillar',
      anio: 2025,
      portada: 'ilustracion-manos.webp',
      tipo: 'imagen',
      titulo: 'hazme brillar',
      imagenes: ['ilustracion-manos.webp']
    },
    'orquidea-gavilea': {
      orden: 7,
      categorias: ['ilustracion'],
      nombre: 'orquídea gavilea',
      anio: 2025,
      portada: 'ilustracion-orquidea.webp',
      tipo: 'imagen',
      titulo: 'orquídea gavilea',
      imagenes: ['ilustracion-orquidea.webp']
    },
    'pinguino-de-humboldt': {
      orden: 8,
      categorias: ['ilustracion'],
      nombre: 'pingüino de humboldt',
      anio: 2025,
      portada: 'ilustracion-pinguinodehumboldt.webp',
      tipo: 'imagen',
      titulo: 'pingüino de humboldt',
      imagenes: ['ilustracion-pinguinodehumboldt.webp']
    },
    'martin-pescador': {
      orden: 9,
      categorias: ['ilustracion'],
      nombre: 'martín pescador',
      anio: 2025,
      portada: 'ilustracion-martinpescador.webp',
      tipo: 'imagen',
      titulo: 'martín pescador',
      imagenes: ['ilustracion-martinpescador.webp']
    }
  };

  // ============ GENERAR TARJETAS DE LA GRILLA ============
  function renderProyectos(){
    const grilla = document.getElementById('grilla-proyectos');
    grilla.innerHTML = Object.entries(proyectosData)
      .sort((a, b) => a[1].orden - b[1].orden)
      .map(([id, p]) => `
        <button type="button" class="proyecto" data-categorias="${p.categorias.join(' ')}" data-id="${id}"${p.portada ? ` style="background:url('${ruta(p.portada)}') center/cover"` : ''}>
          <div class="proyecto__info">
            <p class="proyecto__nombre">${p.nombre}</p>
            <p class="proyecto__categoria">${p.categorias.map(c => nombresCategorias[c] || c).join(' · ')}</p>
          </div>
        </button>`).join('');
  }
  renderProyectos();

  // ============ FILTRO DE PROYECTOS ============
  const botones = document.querySelectorAll('.filtro');
  const proyectos = document.querySelectorAll('.proyecto');

  botones.forEach(boton => {
    boton.addEventListener('click', () => {
      botones.forEach(b => b.classList.remove('activo'));
      boton.classList.add('activo');

      const filtro = boton.dataset.filtro;
      proyectos.forEach(proyecto => {
        const coincide = filtro === 'todo' || proyecto.dataset.categorias.split(' ').includes(filtro);
        proyecto.hidden = !coincide;
      });
    });
  });

  // Año automático en el footer
  document.querySelector('footer').textContent =
    document.querySelector('footer').textContent.replace('{AÑO}', new Date().getFullYear());

  // ============ MODAL DE PROYECTO ============
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal');
  const modalTitulo = document.getElementById('modal-titulo');
  const modalContenido = document.getElementById('modal-contenido');
  const modalCerrar = document.getElementById('modal-cerrar');

  function abrirModal(id){
    const data = proyectosData[id];
    if (!data) return;

    modal.className = 'modal modal--' + data.tipo;
    modalTitulo.textContent = data.titulo;
    let html = '';

    if (data.tipo === 'imagen'){
      html += `<div class="modal__cuerpo"><img src="${ruta(data.imagenes[0])}" alt=""></div>`;
    }

    if (data.tipo === 'galeria'){
      html += '<div class="modal__cuerpo">' +
        data.imagenes.map(src => `<img src="${ruta(src)}" alt="">`).join('') +
        '</div>';
    }

    if (data.tipo === 'concepto'){
      const textos = data.texto || [];
      const bloques = [];
      const maxLen = Math.max(data.imagenes.length, textos.length);
      for (let i = 0; i < maxLen; i++){
        if (data.imagenes[i]) bloques.push(`<img src="${ruta(data.imagenes[i])}" alt="">`);
        if (textos[i]) bloques.push(`<p>${textos[i]}</p>`);
      }
      html += `<div class="modal__cuerpo">${bloques.join('')}</div>`;
    }

    modalContenido.innerHTML = html;
    overlay.classList.add('activo');
    document.body.style.overflow = 'hidden';
  }

  function cerrarModal(){
    overlay.classList.remove('activo');
    document.body.style.overflow = '';
  }

  proyectos.forEach(proyecto => {
    proyecto.addEventListener('click', () => abrirModal(proyecto.dataset.id));
  });

  modalCerrar.addEventListener('click', cerrarModal);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) cerrarModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') cerrarModal();
  });
</script>

</body>
</html>
